<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login — TuitionTrack</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #1e1e2e 0%, #2d1b69 50%, #1e1e2e 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 1rem;
        }
        .login-card {
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(20px);
            padding: 2.5rem 2rem;
            border-radius: 16px;
            width: 380px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.2);
        }
        .login-card .brand {
            text-align: center;
            margin-bottom: 1.75rem;
        }
        .login-card .brand h1 {
            font-size: 1.25rem;
            font-weight: 700;
            color: #1e1e2e;
        }
        .login-card .brand h1 span { color: #6366f1; }
        .login-card .brand p {
            font-size: 0.78rem;
            color: #999;
            margin-top: 0.25rem;
        }
        .form-group { margin-bottom: 1.15rem; }
        .form-group label {
            display: block;
            font-size: 0.7rem;
            font-weight: 600;
            color: #555;
            margin-bottom: 0.35rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .form-group input {
            width: 100%;
            padding: 0.65rem 0.85rem;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 0.9rem;
            font-family: inherit;
            transition: border-color 0.15s, box-shadow 0.15s;
        }
        .form-group input:focus {
            outline: none;
            border-color: #6366f1;
            box-shadow: 0 0 0 3px rgba(99,102,241,0.12);
        }
        .login-btn {
            width: 100%;
            padding: 0.7rem;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
            transition: transform 0.1s, box-shadow 0.15s;
            margin-top: 0.5rem;
        }
        .login-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 16px rgba(99,102,241,0.4);
        }
        .login-btn:active { transform: translateY(0); }
        .error {
            background: #fee2e2;
            color: #991b1b;
            padding: 0.55rem 0.85rem;
            border-radius: 8px;
            font-size: 0.8rem;
            margin-bottom: 1rem;
            border: 1px solid #fecaca;
            text-align: center;
        }
        .footer-text {
            text-align: center;
            margin-top: 1.25rem;
            font-size: 0.7rem;
            color: #bbb;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="brand">
            <h1>Tuition<span>Track</span></h1>
            <p>Admin Panel Login</p>
        </div>
        {% if error %}
        <div class="error">{{ error }}</div>
        {% endif %}
        <form method="POST">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required autofocus placeholder="Enter username">
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required placeholder="Enter password">
            </div>
            <button type="submit" class="login-btn">Sign In</button>
        </form>
        <div class="footer-text">TuitionTrack © 2026 — Internal Use Only</div>
    </div>
</body>
</html>
