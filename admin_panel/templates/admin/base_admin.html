<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Admin{% endblock %} — TuitionTrack Admin</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f5f5;
            color: #333;
            font-size: 14px;
        }

        a {
            color: #4F46E5;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        /* Top nav */
        .topnav {
            background: #1e1e2e;
            color: #fff;
            padding: 0.6rem 1.5rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .topnav .brand {
            font-weight: 700;
            font-size: 1rem;
            letter-spacing: 0.5px;
        }

        .topnav .brand span {
            color: #a78bfa;
        }

        .topnav nav a {
            color: #ccc;
            margin-left: 1.5rem;
            font-size: 0.85rem;
        }

        .topnav nav a:hover,
        .topnav nav a.active {
            color: #fff;
            text-decoration: none;
        }

        .topnav .right {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .topnav .admin-name {
            color: #a78bfa;
            font-size: 0.8rem;
        }

        .topnav .logout-btn {
            color: #f87171;
            font-size: 0.8rem;
        }

        /* Container */
        .container {
            max-width: 1200px;
            margin: 1.5rem auto;
            padding: 0 1.5rem;
        }

        /* Cards grid */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .stat-card {
            background: #fff;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            padding: 1rem 1.25rem;
        }

        .stat-card .label {
            font-size: 0.75rem;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 0.25rem;
        }

        .stat-card .value {
            font-size: 1.75rem;
            font-weight: 700;
            color: #1e1e2e;
        }

        /* Tables */
        table {
            width: 100%;
            border-collapse: collapse;
            background: #fff;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            overflow: hidden;
        }

        th {
            background: #f9fafb;
            text-align: left;
            padding: 0.6rem 0.75rem;
            font-size: 0.75rem;
            text-transform: uppercase;
            color: #666;
            letter-spacing: 0.3px;
            border-bottom: 1px solid #e5e7eb;
        }

        td {
            padding: 0.6rem 0.75rem;
            border-bottom: 1px solid #f0f0f0;
            font-size: 0.85rem;
        }

        tr:hover td {
            background: #f9fafb;
        }

        /* Section headings */
        .section-title {
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 0.75rem;
            color: #1e1e2e;
        }

        .page-title {
            font-size: 1.25rem;
            font-weight: 700;
            margin-bottom: 1rem;
        }

        /* Badge */
        .badge {
            display: inline-block;
            padding: 0.15rem 0.5rem;
            border-radius: 4px;
            font-size: 0.7rem;
            font-weight: 600;
        }

        .badge-green {
            background: #d1fae5;
            color: #065f46;
        }

        .badge-red {
            background: #fee2e2;
            color: #991b1b;
        }

        .badge-gray {
            background: #f3f4f6;
            color: #6b7280;
        }

        /* Simple button */
        .btn {
            display: inline-block;
            padding: 0.4rem 0.9rem;
            border-radius: 6px;
            font-size: 0.8rem;
            border: none;
            cursor: pointer;
            font-weight: 500;
        }

        .btn-primary {
            background: #4F46E5;
            color: #fff;
        }

        .btn-primary:hover {
            background: #4338CA;
            text-decoration: none;
        }

        /* Card panel */
        .panel {
            background: #fff;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            padding: 1.25rem;
            margin-bottom: 1.25rem;
        }

        .muted {
            color: #999;
        }
    </style>
</head>

<body>
    <div class="topnav">
        <div style="display:flex; align-items:center;">
            <div class="brand">Tuition<span>Track</span> Admin</div>
            <nav>
                <a href="{{ url_for('admin.dashboard') }}"
                    class="{% if request.endpoint == 'admin.dashboard' %}active{% endif %}">Dashboard</a>
                <a href="{{ url_for('admin.teachers') }}"
                    class="{% if request.endpoint == 'admin.teachers' %}active{% endif %}">Teachers</a>
                <a href="{{ url_for('admin.students') }}"
                    class="{% if request.endpoint == 'admin.students' %}active{% endif %}">Students</a>
            </nav>
        </div>
        <div class="right">
            <span class="admin-name">{{ session.get('admin_name', 'Admin') }}</span>
            <a href="{{ url_for('admin.logout') }}" class="logout-btn">Logout</a>
        </div>
    </div>

    <div class="container">
        {% block content %}{% endblock %}
    </div>
</body>

</html>
