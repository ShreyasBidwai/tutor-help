{% extends "base.html" %}

{% block title %}Complete Signup - Tuition Name{% endblock %}

{% block content %}
<div style="max-width: 450px; margin: 4rem auto; padding: 2rem;">
    <div class="card">
        <div class="text-center mb-4">
            <h1 style="font-size: 1.5rem; color: #4F46E5; font-weight: 700;">Tuition Name</h1>
            <p style="color: #666; font-size: 0.95rem;">What is the name of your tuition or coaching center?</p>
        </div>

        {% if error %}
        <div class="alert alert-error" style="margin-bottom: 1.5rem;">
            {{ error }}
        </div>
        {% endif %}

        <form method="POST">
            <div class="form-group mb-4">
                <label class="form-label" for="tuition_name">Tuition Name</label>
                <input type="text" name="tuition_name" id="tuition_name" class="form-input"
                    placeholder="e.g. Excellence Tutorials" required autofocus>
            </div>

            <button type="submit" class="btn btn-primary btn-block">
                Create Account
            </button>
        </form>

        <div class="text-center mt-3">
            <a href="{{ url_for('auth.logout') }}" style="color: #666; font-size: 0.85rem;">Cancel Signup</a>
        </div>
    </div>
</div>
{% endblock %}
