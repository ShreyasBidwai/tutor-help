{% extends "base.html" %}

{% block title %}Tutor Login - TuitionTrack{% endblock %}

{% block content %}
<div style="max-width: 450px; margin: 3rem auto; padding: 1rem;">
    <div class="card" style="box-shadow: 0 4px 20px rgba(0,0,0,0.1);">
        <div class="text-center mb-3">
            <div style="margin-bottom: 0.25rem;">
                <img src="{{ url_for('static', filename='TutionTrack_logoNoBG.png') }}" alt="TuitionTrack Logo"
                    style="max-width: 250px; height: auto;">
            </div>
            <h1
                style="font-size: 1.75rem; margin-bottom: 0.25rem; color: #4F46E5; font-weight: 700; margin-top: 0.5rem;">
                Tutor Portal</h1>
            <p style="color: #666; margin-bottom: 0;">Better Tracking. Better Learning.</p>
        </div>

        <!-- Tabs -->
        <div style="display: flex; gap: 0.5rem; margin: 1.5rem 0 1.25rem 0; border-bottom: 2px solid #E5E7EB;">
            <button onclick="switchTab('login')" id="tab-login"
                style="flex: 1; padding: 0.75rem; border: none; background: none; font-size: 1rem; font-weight: 600; color: #4F46E5; border-bottom: 3px solid #4F46E5; cursor: pointer; transition: all 0.2s;">
                Login
            </button>
            <button onclick="switchTab('signup')" id="tab-signup"
                style="flex: 1; padding: 0.75rem; border: none; background: none; font-size: 1rem; font-weight: 600; color: #999; cursor: pointer; transition: all 0.2s;">
                Sign Up
            </button>
        </div>

        {% if error %}
        <div class="alert alert-error" style="margin-bottom: 1.5rem;">
            {{ error }}
        </div>
        {% endif %}

        <div id="js-error-alert" class="alert alert-error" style="display: none; margin-bottom: 1.5rem;"></div>

        <!-- Login Form -->
        <div id="form-login">
            <form id="login-form" method="POST" action="{{ url_for('auth.login') }}" novalidate>
                <input type="hidden" name="action" value="login">
                <div class="form-group">
                    <label class="form-label" for="mobile-login">Mobile Number</label>
                    <input type="tel" id="mobile-login" name="mobile" class="form-input"
                        placeholder="Enter 10-digit mobile number" maxlength="10" autofocus>
                </div>

                <div class="form-group" style="margin-top: 1rem;">
                    <label class="form-label" for="password-login">Password</label>
                    <input type="password" id="password-login" name="password" class="form-input"
                        placeholder="Enter your password">
                </div>

                <button type="submit" class="btn btn-primary btn-block" style="margin-top: 1.5rem;">
                    Login
                </button>
            </form>
            <div style="text-align: center; margin-top: 1rem;">
                <a href="{{ url_for('auth.welcome') }}"
                    style="color: #4F46E5; text-decoration: none; font-size: 0.9375rem; display: inline-flex; align-items: center; gap: 0.5rem; font-weight: 500; padding: 0.5rem 0.75rem; border-radius: 8px; transition: all 0.2s; background: rgba(79, 70, 229, 0.05);">
                    <span style="font-size: 1.125rem;">←</span> Back to Welcome
                </a>
            </div>
        </div>

        <!-- Signup Form -->
        <div id="form-signup" style="display: none;">
            <form id="signup-start-form" method="POST" action="{{ url_for('auth.login') }}" novalidate>
                <input type="hidden" name="action" value="signup">
                <div class="form-group">
                    <label class="form-label" for="mobile-signup">Mobile Number</label>
                    <input type="tel" id="mobile-signup" name="mobile" class="form-input"
                        placeholder="Enter 10-digit mobile number" maxlength="10">
                </div>

                <button type="submit" class="btn btn-primary btn-block" style="margin-top: 1.5rem;">
                    Continue to Sign Up
                </button>
            </form>
            <div style="text-align: center; margin-top: 1rem;">
                <a href="{{ url_for('auth.welcome') }}"
                    style="color: #4F46E5; text-decoration: none; font-size: 0.9375rem; display: inline-flex; align-items: center; gap: 0.5rem; font-weight: 500; padding: 0.5rem 0.75rem; border-radius: 8px; transition: all 0.2s; background: rgba(79, 70, 229, 0.05);">
                    <span style="font-size: 1.125rem;">←</span> Back to Welcome
                </a>
            </div>
        </div>

        <p style="text-align: center; margin-top: 1.5rem; font-size: 0.875rem; color: #999;">
            By continuing, you agree to our Terms of Service
        </p>
    </div>
</div>

<style>
    a[href*="welcome"]:hover {
        background: rgba(79, 70, 229, 0.1) !important;
        color: #4338CA !important;
        transform: translateX(-2px);
    }
</style>

<script>
    // Initialize tab state
    const activeTab = '{{ active_tab|default("login") }}';
    if (activeTab === 'signup') {
        switchTab('signup');
    }

    function switchTab(tab) {
        // Hide all forms
        document.getElementById('form-login').style.display = 'none';
        document.getElementById('form-signup').style.display = 'none';

        // Reset tab styles
        document.getElementById('tab-login').style.color = '#999';
        document.getElementById('tab-login').style.borderBottom = 'none';
        document.getElementById('tab-signup').style.color = '#999';
        document.getElementById('tab-signup').style.borderBottom = 'none';

        // Show selected form and update tab
        if (tab === 'login') {
            document.getElementById('form-login').style.display = 'block';
            document.getElementById('tab-login').style.color = '#4F46E5';
            document.getElementById('tab-login').style.borderBottom = '3px solid #4F46E5';
            document.getElementById('mobile-login').focus();
        } else {
            document.getElementById('form-signup').style.display = 'block';
            document.getElementById('tab-signup').style.color = '#4F46E5';
            document.getElementById('tab-signup').style.borderBottom = '3px solid #4F46E5';
            document.getElementById('mobile-signup').focus();
        }
    }

    function hideError() {
        const errorDiv = document.getElementById('js-error-alert');
        if (errorDiv.style.display !== 'none') {
            errorDiv.style.display = 'none';
            errorDiv.textContent = '';
        }
    }

    // Auto-format mobile number inputs and hide errors
    document.getElementById('mobile-login').addEventListener('input', function (e) {
        this.value = this.value.replace(/[^0-9]/g, '');
        hideError();
    });

    document.getElementById('password-login').addEventListener('input', function (e) {
        hideError();
    });

    document.getElementById('mobile-signup').addEventListener('input', function (e) {
        this.value = this.value.replace(/[^0-9]/g, '');
        hideError();
    });

    document.getElementById('login-form').addEventListener('submit', function (e) {
        const mobile = document.getElementById('mobile-login').value.trim();
        const password = document.getElementById('password-login').value.trim();
        const errorDiv = document.getElementById('js-error-alert');

        // Reset error
        errorDiv.style.display = 'none';
        errorDiv.textContent = '';

        if (!mobile) {
            e.preventDefault();
            errorDiv.textContent = 'Please enter your mobile number.';
            errorDiv.style.display = 'block';
            return;
        }

        if (mobile.length !== 10) {
            e.preventDefault();
            errorDiv.textContent = 'Please enter a valid 10-digit mobile number.';
            errorDiv.style.display = 'block';
            return;
        }

        if (!password) {
            e.preventDefault();
            errorDiv.textContent = 'Please enter your password.';
            errorDiv.style.display = 'block';
            return;
        }
    });

    document.getElementById('signup-start-form').addEventListener('submit', function (e) {
        const mobile = document.getElementById('mobile-signup').value.trim();
        const errorDiv = document.getElementById('js-error-alert');

        // Reset error
        errorDiv.style.display = 'none';
        errorDiv.textContent = '';

        if (!mobile) {
            e.preventDefault();
            errorDiv.textContent = 'Please enter your mobile number.';
            errorDiv.style.display = 'block';
            return;
        }

        if (mobile.length !== 10) {
            e.preventDefault();
            errorDiv.textContent = 'Please enter a valid 10-digit mobile number.';
            errorDiv.style.display = 'block';
            return;
        }
    });
</script>
{% endblock %}
