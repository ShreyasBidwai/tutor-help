{% extends "base.html" %}

{% block title %}Complete Signup - Mobile Number{% endblock %}

{% block content %}
<div style="max-width: 450px; margin: 4rem auto; padding: 2rem;">
    <div class="card">
        <div class="text-center mb-4">
            <h1 style="font-size: 1.5rem; color: #4F46E5; font-weight: 700;">Mobile Number</h1>
            <p style="color: #666; font-size: 0.95rem;">Please provide your mobile number to complete your account
                setup.</p>
        </div>

        {% if error %}
        <div class="alert alert-error" style="margin-bottom: 1.5rem;">
            {{ error }}
        </div>
        {% endif %}

        <form method="POST">
            <div class="form-group mb-4">
                <label class="form-label" for="mobile">Mobile Number</label>
                <input type="tel" name="mobile" id="mobile" class="form-input"
                    placeholder="Enter 10-digit mobile number" pattern="[0-9]{10}" maxlength="10" required autofocus>
            </div>

            <button type="submit" class="btn btn-primary btn-block">
                Continue
            </button>
        </form>

        <div class="text-center mt-3">
            <a href="{{ url_for('auth.logout') }}" style="color: #666; font-size: 0.85rem;">Cancel Signup</a>
        </div>
    </div>
</div>
{% endblock %}
