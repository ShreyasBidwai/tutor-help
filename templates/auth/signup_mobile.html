{% extends "base.html" %}

{% block title %}Complete Signup - Tutor Portal{% endblock %}

{% block content %}
<div style="max-width: 450px; margin: 3rem auto; padding: 1rem;">
    <div class="card" style="box-shadow: 0 4px 20px rgba(0,0,0,0.1);">
        <div class="text-center mb-3">
            <h1 style="font-size: 1.5rem; margin-bottom: 0.25rem; color: #4F46E5; font-weight: 700;">Mobile Number</h1>
            <p style="color: #666; margin-bottom: 0;">Step 1 of 2: Please provide your contact number</p>
        </div>

        {% if error %}
        <div class="alert alert-error" style="margin-bottom: 1.5rem;">
            {{ error }}
        </div>
        {% endif %}

        <div id="js-error-alert" class="alert alert-error" style="display: none; margin-bottom: 1.5rem;"></div>

        <form id="signup-mobile-form" method="POST" novalidate>
            <div class="form-group">
                <label class="form-label" for="mobile">Mobile Number</label>
                <input type="tel" id="mobile" name="mobile" class="form-input"
                    placeholder="Enter 10-digit mobile number" maxlength="10" autofocus>
            </div>

            <button type="submit" class="btn btn-primary btn-block" style="margin-top: 1.5rem;">
                Next Step
            </button>
        </form>

        <div style="text-align: center; margin-top: 1rem;">
            <a href="{{ url_for('auth.logout') }}" style="color: #666; font-size: 0.875rem;">Cancel Signup</a>
        </div>
    </div>
</div>

<script>
    function hideError() {
        const errorDiv = document.getElementById('js-error-alert');
        if (errorDiv.style.display !== 'none') {
            errorDiv.style.display = 'none';
            errorDiv.textContent = '';
        }
    }

    document.getElementById('mobile').addEventListener('input', function (e) {
        this.value = this.value.replace(/[^0-9]/g, '');
        hideError();
    });

    document.getElementById('signup-mobile-form').addEventListener('submit', function (e) {
        const mobile = document.getElementById('mobile').value.trim();
        const errorDiv = document.getElementById('js-error-alert');

        // Reset error
        errorDiv.style.display = 'none';
        errorDiv.textContent = '';

        if (!mobile) {
            e.preventDefault();
            errorDiv.textContent = 'Please enter your mobile number.';
            errorDiv.style.display = 'block';
            return;
        }

        if (mobile.length !== 10) {
            e.preventDefault();
            errorDiv.textContent = 'Please enter a valid 10-digit mobile number.';
            errorDiv.style.display = 'block';
            return;
        }
    });
</script>
{% endblock %}
